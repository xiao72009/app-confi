name: 更新配置源清单

on:
  schedule:
    # 每天北京时间 04:17（UTC 20:17）
    - cron: "17 20 * * *"
  # 也可以在仓库的 Actions 页面手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests cryptography

      - name: 检查种子并自动发现新配置
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_manifest.py --discover

      - name: 签名
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: python tools/sign_manifest.py

      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest
          if [ -d mirror ]; then git add mirror; fi
          if git diff --cached --quiet; then
            echo "清单没有变化"
          else
            git commit -m "自动更新配置源清单"
            git push
          fi

      # 先提交 GitHub 再同步 Gitee：Gitee 出问题时，GitHub 上的清单照样更新
      - name: 同步到 Gitee（国内可访问）
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python tools/sync_gitee.py
